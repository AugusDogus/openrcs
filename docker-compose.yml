# Self-hosted openrcs (docs/self-hosting.md). Copy .env.selfhost.example to
# .env, set OPENRCS_URL, then: docker compose up -d --build
# Then, on this machine: tailscale serve --bg --https=5443 http://127.0.0.1:5480
services:
  openrcs:
    image: ${OPENRCS_IMAGE:-openrcs:local}
    build: .
    # Reachable only from this machine's loopback, where Tailscale Serve
    # picks it up. Sign-in trusts Serve's identity headers, so never publish
    # it on another address. Compose gives it a network of its own.
    ports:
      - "127.0.0.1:${OPENRCS_PORT:-5480}:3000"
    # The sign-in browser (Chromium) keeps its throwaway profile in /dev/shm.
    shm_size: 1gb
    environment:
      OPENRCS_URL: ${OPENRCS_URL:?set OPENRCS_URL in .env}
    volumes:
      - ${OPENRCS_DATA:-./data}:/data
    restart: unless-stopped
