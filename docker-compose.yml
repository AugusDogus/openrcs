# Self-hosted openrcs on your tailnet (docs/self-hosting.md).
# Copy .env.selfhost.example to .env, fill it in, then: docker compose up -d
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-openrcs}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-openrcs}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      # Only needed for the first login; a stored node key is reused after that.
      TS_AUTH_ONCE: "true"
    volumes:
      - ${OPENRCS_DATA:-./data}/tailscale:/var/lib/tailscale
      - ./docker/tailscale:/config:ro
    restart: unless-stopped

  openrcs:
    image: ${OPENRCS_IMAGE:-openrcs:local}
    build: .
    # Shares the Tailscale container's network namespace and publishes no
    # ports: the app listens on 127.0.0.1:3000 and only Tailscale Serve
    # (HTTPS on 443, tailnet only) can reach it.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      OPENRCS_URL: ${OPENRCS_URL:?set OPENRCS_URL in .env}
    volumes:
      - ${OPENRCS_DATA:-./data}/openrcs:/data
    restart: unless-stopped
