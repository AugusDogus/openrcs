# openrcs: replaces the Selkies base image's site. init-nginx fills in the
# port (3000), SUBFOLDER (/pairing-browser/) and CWS (the Selkies WebSocket
# port); init-openrcs fills in OPENRCS_LISTEN (0.0.0.0 unless OPENRCS_BIND).
# Only Tailscale Serve on the host should reach this port: publish it on the
# host's loopback alone.
server {
  listen OPENRCS_LISTEN:3000 default_server;
  server_tokens off;
  client_max_body_size 1m;

  # openrcs (Next.js). Client headers pass through unchanged, including the
  # Tailscale-User-* identity headers that Tailscale Serve sets.
  location / {
    proxy_pass              http://127.0.0.1:3100;
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        Connection "";
    # Pairing streams Server-Sent Events for up to 5 minutes.
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout      600s;
    proxy_send_timeout      600s;
  }

  # The sign-in browser stream: only the openrcs user who opened the browser,
  # only while it is open (src/lib/pairing-browser/http.ts).
  location = /_openrcs/pairing-browser-auth {
    internal;
    proxy_pass              http://127.0.0.1:3100/api/pair/browser/authorize;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        Host $host;
  }

  location SUBFOLDER {
    auth_request            /_openrcs/pairing-browser-auth;
    alias                   /usr/share/selkies/web/;
    index                   index.html;
    try_files               $uri $uri/ =404;
    add_header              Cache-Control "no-store" always;
  }

  location SUBFOLDERapi {
    auth_request            /_openrcs/pairing-browser-auth;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_buffering         off;
    proxy_request_buffering off;
    client_max_body_size    0;
    proxy_pass              http://127.0.0.1:CWS;
  }
}
